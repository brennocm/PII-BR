  - "Qualificação: {NOME}, casada, professora, RG {RG}, CPF {CPF}, nascida em {DATA_NASC}."
  - "DISTRATO: as partes {NOME} e {EMPRESA} resolvem rescindir o contrato de {DATA}."
  - "Representante legal: {NOME}, e-mail {EMAIL}, telefone {TELEFONE}."
  - "Este contrato é celebrado pela {EMPRESA}, com filial na {ENDERECO}, CEP {CEP}."
  - "A multa por atraso é de {NUM}% sobre o valor de {VALOR}."
