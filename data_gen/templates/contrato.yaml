  - "Assinam o presente {NOME} e {NOME2}, na presença das testemunhas abaixo."
  - "Por estarem justos e contratados, assinam em {CIDADE}, aos {DATA}."
  - "O inquilino {NOME} compromete-se a devolver o imóvel da {ENDERECO} nas mesmas condições."
  - "ACORDO EXTRAJUDICIAL entre {NOME}, CPF {CPF}, e {EMPRESA}, CNPJ {CNPJ}."
