domain: contrato
templates:
  - "CONTRATANTE: {NOME}, brasileiro(a), portador(a) do RG {RG} e inscrito(a) no CPF sob o nº {CPF}, residente à {ENDERECO}, CEP {CEP}."
  - "CONTRATADA: {EMPRESA}, inscrita no CNPJ sob o nº {CNPJ}, com sede na {ENDERECO}, {CIDADE}."
  - "LOCADOR: {NOME}, CPF {CPF}. LOCATÁRIO: {NOME2}, CPF {CPF2}."
  - "O imóvel situado na {ENDERECO}, CEP {CEP}, será locado pelo valor mensal de {VALOR}."
  - "Pelo presente instrumento, {NOME}, nascido(a) em {DATA_NASC}, doravante denominado(a) DEVEDOR(A), declara dever a quantia de {VALOR}."
  - "As partes elegem o foro da comarca de {CIDADE} para dirimir quaisquer dúvidas."
  - "Testemunha 1: {NOME}, CPF {CPF}. Testemunha 2: {NOME2}, CPF {CPF2}."
  - "{CIDADE}, {DATA}.\n_____________________\n{NOME}"
  - "O FIADOR, {NOME}, RG {RG}, CPF {CPF}, responde solidariamente pelas obrigações."
  - "Notificações deverão ser enviadas ao endereço eletrônico {EMAIL}."
