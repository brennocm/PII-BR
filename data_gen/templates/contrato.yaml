  - "O presente contrato entra em vigor na data de sua assinatura."
  - "Fica eleito o foro de {CIDADE} com renúncia a qualquer outro."
  - "O valor total do contrato é de {VALOR}, pago em {NUM} parcelas mensais."
  - "Parágrafo único: a rescisão antecipada implica multa de {NUM}%."
  - "O prazo de entrega dos serviços é de {NUM} dias úteis."
  - "Este aditivo altera a cláusula {NUM} do contrato nº {PROTOCOLO}."
  - "As partes declaram ter lido e concordado com todas as cláusulas."
  - "A garantia do {PRODUTO} é de {NUM} meses contados da entrega."
  - "O contrato {PROTOCOLO} foi registrado em cartório em {DATA}."
  - "Cláusula 8ª: os casos omissos serão resolvidos de comum acordo."
  - "A vistoria do imóvel será feita em {DATA} às {HORA}."
  - "O índice de correção será o IGP-M, aplicado anualmente."
  - "Vigência: de {DATA} a {DATA2}."
  - "O pagamento deverá ser realizado até o dia {NUM} de cada mês."
  - "A rescisão deverá ser comunicada com {NUM} dias de antecedência."
  - "A loja âncora fica na {RUA_FAMOSA}, conforme anexo II."
