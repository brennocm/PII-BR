domain: atendimento
templates:
  - "Oi, sou {NOME}, meu CPF é {CPF} e moro na {ENDERECO}, CEP {CEP}."
  - "Bom dia, meu nome é {NOME} e queria saber do pedido {PEDIDO}."
  - "Pode confirmar o CPF do titular? É {CPF}, em nome de {NOME}."
  - "O telefone para contato é {TELEFONE}, falar com {NOME}."
  - "Cliente {NOME}, CPF {CPF}, solicitou cancelamento do {PRODUTO}."
  - "Atendente: poderia me informar seu CPF? Cliente: claro, {CPF}."
  - "Sou {NOME}, nascida em {DATA_NASC}, e não reconheço uma cobrança de {VALOR}."
  - "Meu e-mail cadastrado é {EMAIL}, mas não recebo as faturas."
  - "Gostaria de atualizar meu endereço para {ENDERECO}, {CIDADE}, CEP {CEP}."
  - "A conta está no nome do meu pai, {NOME}, CPF {CPF}."
  - "Protocolo {PROTOCOLO} aberto para {NOME}, retorno pelo {TELEFONE}."
  - "Confirmo os dados: {NOME}, RG {RG}, data de nascimento {DATA_NASC}."
  - "Liguei três vezes e ninguém resolve. Meu número é {TELEFONE}."
  - "Senhor {NOME}, sua solicitação foi registrada sob o protocolo {PROTOCOLO}."
  - "Senhora {NOME}, o técnico vai até a {ENDERECO} no dia {DATA}."
  - "Preciso da segunda via do boleto, CPF {CPF}, vencimento {DATA}."
  - "A empresa {EMPRESA}, CNPJ {CNPJ}, quer renegociar a dívida de {VALOR}."
  - "Quem está falando é {NOME}, sou responsável pela conta da {EMPRESA}."
  - "Pode mandar o comprovante para {EMAIL}? Obrigado."
  - "Meu cadastro está com o telefone antigo, o novo é {TELEFONE}."
  - "Recebi a cobrança do pedido {PEDIDO} duas vezes, sou {NOME}."
  - "Para validar sua identidade, confirme a data de nascimento: {DATA_NASC}."
  - "A entrega deve ser feita na {ENDERECO}, CEP {CEP}, aos cuidados de {NOME}."
  - "Sou {NOME}, cliente desde {DATA}, e quero portabilidade."
  - "CPF {CPF}. Esse é o titular, {NOME}. Pode prosseguir."
  - "Por favor, retorne a ligação para {TELEFONE} depois das {HORA}."
  - "O cadastro de {NOME} consta com CEP {CEP}, está correto?"
  - "Minha mãe, {NOME}, nasceu em {DATA_NASC} e precisa do benefício."
  - "Troquei de e-mail. Antes era {EMAIL}, agora é {EMAIL2}."
  - "Sou da {EMPRESA}, nosso CNPJ é {CNPJ} e o pedido é {PEDIDO}."
  - "Quero falar com o gerente. Meu nome é {NOME}, telefone {TELEFONE}."
  - "Dados do titular: {NOME}, CPF {CPF}, RG {RG}, nascido em {DATA_NASC}."
  - "O cliente informou o CPF {CPF} mas o sistema diz que não existe."
  - "Endereço de cobrança: {ENDERECO}. Endereço de entrega: {RUA_FAMOSA}, loja da {EMPRESA}."
  - "Minha esposa {NOME} vai retirar o {PRODUTO} na loja."
  - "Você está falando com {NOME}, em que posso ajudar?"
  - "Só confirmando, o e-mail é {EMAIL} e o celular {TELEFONE}?"
  - "Já mandei meus documentos: RG {RG} e CPF {CPF}."
  - "Estou sem acesso ao app. CPF {CPF}, e-mail {EMAIL}."
  - "Encaminhei para o setor responsável. Prazo de retorno: {DATA}."
  - "O CEP {CEP} não aparece no sistema de entrega."
  - "O pagamento de {VALOR} foi feito em {DATA}, conforme comprovante enviado por {NOME}."
  - "Bom dia! Seu pedido {PEDIDO} saiu para entrega às {HORA}."
  - "Seu protocolo é {PROTOCOLO}. Guarde para futuras consultas."
  - "Informamos que o {PRODUTO} está em falta no estoque de {CIDADE}."
  - "O valor de {VALOR} será estornado em até {NUM} dias úteis."
  - "Nosso horário de atendimento é das 8h às 18h. Ligue {TEL_EMPRESA}."
  - "O pedido {PEDIDO} foi faturado em {DATA} e segue para {CIDADE}."
  - "A loja da {RUA_FAMOSA} fecha às {HORA} aos domingos."
  - "A central {TEL_EMPRESA} funciona 24 horas para emergências."
  - "Não encontramos nenhum cadastro com o código {CODIGO}."
  - "Pedido {PEDIDO}, protocolo {PROTOCOLO}, valor {VALOR}: tudo certo."
