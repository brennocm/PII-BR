domain: log
templates:
  - "{TIMESTAMP} INFO login ok user={EMAIL} ip=10.0.0.12"
  - "{TIMESTAMP} WARN cpf_invalido cpf={CPF} origem=checkout"
  - "{TIMESTAMP} ERROR falha ao validar documento: {CPF}"
  - "[{TIMESTAMP}] INFO cadastro criado nome=\"{NOME}\" cpf={CPF}"
  - "level=info msg=\"pedido criado\" pedido={PEDIDO} cliente_email={EMAIL}"
  - "level=error msg=\"cnpj rejeitado\" cnpj={CNPJ} request_id={UUID}"
  - "{TIMESTAMP} DEBUG payload={\"nome\": \"{NOME}\", \"telefone\": \"{TELEFONE}\"}"
  - "{TIMESTAMP} INFO sms enviado para {TELEFONE}"
  - "{TIMESTAMP} INFO e-mail de boas-vindas enviado para {EMAIL}"
  - "user_id={NUM} name='{NOME}' birth_date={DATA_NASC} status=active"
  - "{TIMESTAMP} WARN tentativa de login falhou para {EMAIL} (3/5)"
  - "{TIMESTAMP} INFO endereco atualizado: {ENDERECO}, cep={CEP}"
  - "ERROR ValidationError: campo 'cpf' inválido: '{CPF}'"
  - "ERROR ValidationError: campo 'cep' inválido: '{CEP}'"
  - "{TIMESTAMP} INFO consulta receita cnpj={CNPJ} situacao=ATIVA"
  - "Traceback: KeyError ao processar cliente {NOME} ({CPF})"
  - "{TIMESTAMP} AUDIT usuario={EMAIL} acessou ficha de {NOME}"
  - "{TIMESTAMP} INFO webhook pagamento aprovado pagador_cpf={CPF} valor={VALOR}"
  - "{\"ts\":\"{TIMESTAMP}\",\"level\":\"info\",\"email\":\"{EMAIL}\",\"event\":\"signup\"}"
  - "{\"cpf\":\"{CPF}\",\"nome\":\"{NOME}\",\"nascimento\":\"{DATA_NASC}\"}"
  - "{\"telefone\":\"{TELEFONE}\",\"cep\":\"{CEP}\",\"pedido\":\"{PEDIDO}\"}"
  - "INSERT INTO clientes (nome, cpf, email) VALUES ('{NOME}', '{CPF}', '{EMAIL}');"
  - "UPDATE clientes SET telefone='{TELEFONE}' WHERE cpf='{CPF}';"
  - "SELECT * FROM pedidos WHERE email = '{EMAIL}';"
  - "{TIMESTAMP} WARN rg duplicado rg={RG} nome={NOME}"
  - "{TIMESTAMP} INFO nota emitida cnpj_tomador={CNPJ} valor={VALOR}"
  - "GET /api/v1/clientes?cpf={CPF} 200 35ms"
  - "GET /api/v1/cep/{CEP} 404 12ms"
  - "POST /api/v1/usuarios 201 email={EMAIL}"
  - "{TIMESTAMP} INFO entrega agendada para {ENDERECO} destinatario={NOME}"
  - "{TIMESTAMP} ERROR timeout ao ligar para {TELEFONE}"
  - "mask_failed field=nome value={NOME}"
  - "{TIMESTAMP} INFO export lgpd titular={NOME} cpf={CPF} formato=json"
  - "{TIMESTAMP} INFO kyc aprovado nome={NOME} data_nasc={DATA_NASC} rg={RG}"
  - "{TIMESTAMP} INFO servico iniciado na porta {NUM}"
  - "{TIMESTAMP} INFO pedido={PEDIDO} status=faturado valor={VALOR}"
  - "{TIMESTAMP} WARN latencia alta: {NUM}ms em /api/v1/pedidos"
  - "{TIMESTAMP} ERROR conexão recusada ao banco (tentativa {NUM})"
  - "{TIMESTAMP} DEBUG cache hit key=produto:{CODIGO}"
  - "level=info msg=\"job concluído\" job_id={UUID} duracao={NUM}s"
  - "GET /api/v1/pedidos/{PEDIDO} 200 18ms"
  - "{TIMESTAMP} INFO deploy versão {NUM}.{NUM2}.0 concluído"
  - "{TIMESTAMP} INFO protocolo={PROTOCOLO} status=aberto"
  - "{TIMESTAMP} WARN estoque baixo produto={CODIGO} qtd={NUM}"
  - "{\"ts\":\"{TIMESTAMP}\",\"event\":\"healthcheck\",\"status\":\"ok\"}"
  - "{TIMESTAMP} INFO boleto gerado codigo={CODIGO} vencimento={DATA}"
  - "{TIMESTAMP} INFO filial={CIDADE} vendas={VALOR}"
  - "{TIMESTAMP} ERROR OutOfMemoryError no worker {NUM}"
  - "{TIMESTAMP} INFO request_id={UUID} rota=/checkout status=200"
  - "{TIMESTAMP} INFO rastreio={CODIGO} status=em_transito"
  - "{TIMESTAMP} INFO 0 registros processados"
  - "{TIMESTAMP} INFO sincronização com {EMPRESA} concluída"
