  - "Favor cadastrar o fornecedor {EMPRESA}, CNPJ {CNPJ}, endereço {ENDERECO}, CEP {CEP}."
  - "Cara {NOME}, confirmamos sua inscrição no evento de {DATA}."
  - "Segue o reembolso de {NOME}, CPF {CPF}, no valor de {VALOR}."
  - "Pessoal, o {NOME} está de férias até {DATA}. Assuntos urgentes, falar com {NOME2} pelo {TELEFONE}."
