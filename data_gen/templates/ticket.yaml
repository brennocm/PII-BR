domain: ticket
templates:
  - "Chamado {PROTOCOLO}: usuário {NOME} ({EMAIL}) sem acesso ao sistema desde {DATA}."
  - "Solicitante: {NOME}. Ramal ou celular: {TELEFONE}. Problema: impressora não imprime."
  - "Cliente {NOME} relata erro ao cadastrar CPF {CPF} no portal."
  - "O usuário {EMAIL} não consegue redefinir a senha."
  - "Favor criar conta de e-mail para {NOME}, novo colaborador, admissão em {DATA}."
  - "Erro ao validar CNPJ {CNPJ} na emissão de nota da {EMPRESA}."
  - "Incidente: dados de {NOME} (CPF {CPF}) aparecem para outro usuário."
  - "Bloquear acesso de {NOME}, desligado em {DATA}. Login: {EMAIL}."
  - "Contato do solicitante: {TELEFONE} / {EMAIL}"
  - "Cliente informa que o CEP {CEP} retorna endereço errado."
  - "Atualizar cadastro: {NOME} mudou para {ENDERECO}, CEP {CEP}."
  - "Reembolso do {NOME} parado na aprovação. CPF {CPF}, valor {VALOR}."
  - "Usuário {NOME} reporta lentidão no notebook patrimônio {CODIGO}."
  - "Prioridade alta: {NOME} da diretoria sem e-mail. Celular {TELEFONE}."
  - "A aluna {NOME}, nascida em {DATA_NASC}, não aparece na lista de chamada."
  - "Ticket reaberto por {NOME}: o problema voltou após a atualização."
  - "Validar documento: RG {RG} do candidato {NOME} está ilegível."
  - "Duplicidade de cadastro: {NOME} com CPFs {CPF} e {CPF2}."
  - "Teste de integração falhou com o CPF {CPF} (dígito inválido?)."
  - "Solicito exclusão dos meus dados conforme a LGPD. {NOME}, CPF {CPF}, e-mail {EMAIL}."
  - "Pedido de acesso a dados pessoais (LGPD): titular {NOME}, telefone {TELEFONE}."
  - "Fornecedor {EMPRESA} (CNPJ {CNPJ}) não recebe os pagamentos."
  - "Entrega não realizada no endereço {ENDERECO}. Destinatário: {NOME}."
  - "Atribuído a {NOME}. Previsão de solução: {DATA}."
  - "Comentário de {NOME}: reiniciei o servidor e normalizou."
  - "Novo acesso VPN para {NOME} ({EMAIL}), gestor {NOME2}."
  - "Paciente {NOME}, {DATA_NASC}, prontuário não sincronizou."
  - "Usuário com e-mail {EMAIL} recebeu cobrança indevida de {VALOR}."
  - "Sr(a). {NOME} ligou do número {TELEFONE} reclamando do atendimento."
  - "Erro 500 ao salvar o endereço {ENDERECO} no checkout."
  - "Data de nascimento {DATA_NASC} rejeitada no formulário do cliente {NOME}."
  - "Atualizar telefone do cliente {NOME}: de {TELEFONE} para {TELEFONE2}."
  - "Conta PJ {EMPRESA}, CNPJ {CNPJ}, travada após tentativa de login."
  - "Responsável técnico: {NOME}. Escalonado para N2."
  - "Abrir chamado para {NOME} com a fornecedora {EMPRESA}."
  - "O cliente {NOME} pediu para não ser contatado pelo {TELEFONE}."
  - "Erro de timeout na API de pagamentos às {HORA}."
  - "Servidor de arquivos sem espaço em disco. Liberar {NUM} GB."
  - "Atualização do sistema agendada para {DATA} às {HORA}."
  - "Impressora do {NUM}º andar sem toner."
  - "Chamado {PROTOCOLO} encerrado por inatividade."
  - "Falha na sincronização do pedido {PEDIDO} com o ERP."
  - "Certificado SSL expira em {DATA}. Renovar."
  - "Ajustar regra de firewall para a filial de {CIDADE}."
  - "Licença do {PRODUTO} vencida, solicitar renovação."
  - "Erro ao gerar boleto do pedido {PEDIDO}: código {CODIGO}."
  - "Backup noturno falhou. Job {UUID}."
  - "Usuários da unidade {RUA_FAMOSA} sem internet desde {HORA}."
  - "Prioridade: média. SLA: {NUM} horas."
  - "Status alterado de 'em andamento' para 'resolvido'."
  - "Reprocessar fila de notas fiscais de {DATA}."
  - "Telefonia: o {TEL_EMPRESA} está fora do ar."
