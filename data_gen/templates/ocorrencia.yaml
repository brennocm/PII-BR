  - "O fato ocorreu na {ENDERECO}, bairro de grande movimento."
  - "Envolvido 1: {NOME}, CPF {CPF}. Envolvido 2: {NOME2}, CPF {CPF2}."
  - "A guarnição foi acionada às {HORA} para atender ocorrência na {ENDERECO}."
  - "Requerente: {NOME}, telefone {TELEFONE}. Requerido: {NOME2}."
  - "Desaparecido: {NOME}, nascido em {DATA_NASC}, visto pela última vez em {CIDADE}."
  - "Contato da família: {NOME}, {TELEFONE}."
  - "Perfil falso em nome de {NOME} usando o telefone {TELEFONE}."
  - "Boletim registrado por {NOME}, CPF {CPF}, em {DATA}."
  - "O suspeito utilizava o e-mail {EMAIL} para aplicar golpes."
  - "Endereço do fato: {ENDERECO}, CEP {CEP}, {CIDADE}."
  - "A vítima {NOME} reconheceu o autor por fotografia."
  - "Compareceu o Sr. {NOME}, portador do RG {RG}, noticiando extravio de documentos."
  - "Relata a Sra. {NOME} que seu ex-companheiro, {NOME2}, a ameaçou por mensagens."
  - "Conta bancária de destino em nome de {NOME}, CPF {CPF}."
  - "Loja {EMPRESA} (CNPJ {CNPJ}) foi arrombada durante a madrugada."
  - "Condutor do veículo: {NOME}, CNH vencida, residente na {ENDERECO}."
  - "O menor {NOME}, nascido em {DATA_NASC}, estava acompanhado da mãe, {NOME2}."
  - "A vítima informa que seus dados ({CPF}, {DATA_NASC}) foram usados para abrir conta."
  - "Notificante: {NOME}. Contato: {TELEFONE}. Fato: perturbação do sossego."
  - "Informante: {NOME}, e-mail {EMAIL}, solicita sigilo."
  - "A ocorrência foi encaminhada à delegacia de {CIDADE}."
