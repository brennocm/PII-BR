domain: ocorrencia
templates:
  - "Comparece nesta unidade {NOME}, RG {RG}, CPF {CPF}, residente na {ENDERECO}, para registrar ocorrência."
  - "A vítima, {NOME}, nascida em {DATA_NASC}, relata que teve o celular furtado na {RUA_FAMOSA}."
  - "Qualificação do comunicante: {NOME}, telefone {TELEFONE}, e-mail {EMAIL}."
  - "O autor, identificado como {NOME}, fugiu em direção à {RUA_FAMOSA}."
  - "Testemunha: {NOME}, CPF {CPF}, residente na {ENDERECO}, CEP {CEP}."
  - "Narra a declarante {NOME} que, no dia {DATA}, por volta das {HORA}, sua residência foi invadida."
  - "O veículo estava estacionado em frente à {ENDERECO} quando foi danificado."
  - "A empresa {EMPRESA}, CNPJ {CNPJ}, representada por {NOME}, comunica furto de equipamentos."
  - "Vítima: {NOME}. Idade: {NUM} anos. Data de nascimento: {DATA_NASC}."
  - "O comunicante informa que recebeu ligações do número {TELEFONE} se passando pelo banco."
