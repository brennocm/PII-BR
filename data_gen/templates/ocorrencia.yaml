  - "O fato ocorreu na esquina da {RUA_FAMOSA} com a rua lateral."
  - "Registro realizado pela delegacia eletrônica em {DATA}."
  - "Natureza: estelionato. Valor envolvido: {VALOR}."
  - "As imagens das câmeras foram requisitadas ao comércio local."
  - "Prazo para representação: {NUM} meses."
  - "Inquérito instaurado sob o nº {PROTOCOLO}."
  - "O local estava sem iluminação pública."
  - "Foram ouvidas {NUM} testemunhas no local."
  - "O caso foi registrado em {CIDADE} às {HORA}."
  - "Situação: em apuração."
