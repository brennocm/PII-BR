[tools]
python = "3.11"
uv = "0.13.6"
gitleaks = "8.30.1"
lefthook = "2.2.2"

[tasks.check]
description = "Definição de pronto: formato, lint, tipos e testes"
run = [
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run pyright",
  "uv run pytest -q -n auto",
]

[tasks."check:all"]
description = "check + cobertura, código morto, dependências, auditoria e segredos (CI)"
run = [
  "mise run check",
  "uv run coverage run -m pytest -q",
  "uv run coverage report",
  "uv run deptry src",
  "uv run vulture src --min-confidence 80",
  "uv run pip-audit --skip-editable",
  "uv run python scripts/audit_local_builds.py",
  "gitleaks git --redact --no-banner .",
]

[tasks.dev]
description = "Sobe o app do Space em http://127.0.0.1:7860 (PII_BR_MODEL=<repo|pasta> para usar um modelo)"
run = "uv run --all-extras --group space python space/app.py"

[tasks.setup]
description = "Instala dependências e os hooks de pre-commit"
run = ["uv sync --all-extras", "lefthook install"]

[tasks.fix]
description = "Aplica todas as correções automáticas"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.test]
description = "Testes; aceita um caminho (mise run test -- tests/test_validators.py)"
run = "uv run pytest -q"
