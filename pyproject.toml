[project]
name = "PII-BR"
version = "0.1.0"
description = "Detecção e mascaramento de dados pessoais (PII) em português do Brasil para a LGPD"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# O núcleo (validadores, recognizers, fusão, mascaramento) só usa a biblioteca padrão.
dependencies = []

[project.optional-dependencies]
# Modelo NER (pii_br.model). O núcleo funciona sem ele, só com regex + validação.
model = ["torch>=2.4", "transformers>=5.0,<6"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-xdist",
    "coverage",
    "deptry",
    "vulture",
    "pip-audit",
    # Oráculos independentes para os validadores (não usados pelo pacote)
    "validate-docbr",
    "faker",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
]
hub = ["datasets", "huggingface-hub"]
train = ["torch", "transformers", "accelerate", "datasets", "seqeval", "nbconvert", "ipykernel"]
baseline = [
    "presidio-analyzer",
    "pt-core-news-lg",
    "spacy",
]
space = ["gradio"]

[tool.uv]
default-groups = ["dev"]
# Supply chain: não resolver versões publicadas há menos de alguns dias; atualizar de propósito.
exclude-newer = "2026-11-16T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "ANN", "E501"]  # S603: subprocess só com sys.executable
"data_gen/**" = ["S311"]
# Notebook roda no Kaggle/Colab: anotações de tipo só poluiriam as células.
"*.ipynb" = ["ANN", "B905", "S603"]
# random.Random gera dados sintéticos reprodutíveis por seed, não segredos.
"src/pii_br/validators.py" = ["S311"]
# O rng do mascaramento sintético gera valores falsos; o segredo (sal do HMAC) usa `secrets`.
"src/pii_br/masking.py" = ["S311"]

[tool.pyright]
include = ["src", "tests", "data_gen", "training", "space", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[[tool.pyright.executionEnvironments]]
# faker e datasets não têm tipos completos; o gerador só usa chamadas simples deles.
root = "data_gen"
extraPaths = ["."]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
# presidio e huggingface_hub têm tipos incompletos; a avaliação só usa chamadas simples.
root = "training"
extraPaths = ["."]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
# gradio e huggingface_hub têm tipos incompletos.
root = "space"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "scripts"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[[tool.pyright.executionEnvironments]]
# validate_docbr e faker não têm stubs de tipo; os testes os usam só como oráculo.
root = "tests"
extraPaths = ["."]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["pii_br"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.deptry.per_rule_ignores]
DEP002 = ["ruff", "pyright", "pytest", "pytest-xdist", "coverage", "deptry", "vulture", "pip-audit"]

# Torch só para CPU localmente (no Kaggle/Colab o notebook usa o torch com CUDA da plataforma).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
pt-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl" }
